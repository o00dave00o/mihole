name: Update Pi-hole Blocklist

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run blocklist consolidator
        run: python blocklists.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Stage the new split files
          git add hagezi.txt general.txt
          
          # Clean up old combined files from git if they exist
          [ -f blocklist.txt ] && git rm -f blocklist.txt || true
          [ -f blocklist1.txt ] && git rm -f blocklist1.txt || true
          [ -f blocklist2.txt ] && git rm -f blocklist2.txt || true

          # Autostash and rebase to prevent push rejections
          git pull --rebase --autostash origin main
          git diff --staged --quiet || (git commit -m "Auto-update split blocklists [skip ci]" && git push)
