name: Update Pi-hole Blocklist

on:
  schedule:
    - cron: '0 2 * * *' # Runs every day at 2:00 AM UTC
  workflow_dispatch: # Allows you to trigger it manually from GitHub anytime

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed so the action can push the updated file back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run blocklist consolidator
        run: python blocklists.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add blocklist.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update blocklist [skip ci]" && git push)
