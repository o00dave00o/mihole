name: Update Pi-hole Blocklist

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run blocklist consolidator
        run: python blocklists.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 1. Stage the freshly generated file first
          git add blocklist.txt
          
          # 2. Pull remote changes with autostash enabled so rebase doesn't break
          git pull --rebase --autostash origin main
          
          # 3. Commit and push if there are changes
          git diff --staged --quiet || (git commit -m "Auto-update blocklist [skip ci]" && git push)
